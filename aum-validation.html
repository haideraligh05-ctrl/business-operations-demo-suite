<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUM Movement Validation</title><style>
body{margin:0;background:#eef2f6;color:#142d40;font:16px system-ui}main{max-width:680px;margin:6vh auto;padding:24px}form{background:white;border-radius:12px;padding:24px;display:grid;gap:14px}label{display:grid;gap:6px}input,select,button{font:inherit;padding:10px}output{display:block;margin-top:20px;background:#173950;color:white;padding:18px;border-radius:9px;white-space:pre-line}button{background:#165e6b;color:white;border:0;border-radius:7px}
</style><main><h1>AUM Movement Validation</h1><p>Reconcile synthetic opening and closing balances against the reported change.</p><form><label>Opening AUM<input name="opening" type="number" min="0" max="1000000" value="1000" required></label><label>Closing AUM<input name="closing" type="number" min="0" max="1000000" value="950" required></label><label>Reported movement<input name="reported" type="number" min="-1000000" max="1000000" value="-50" required></label><button>Run scenario</button></form><output aria-live="polite"></output></main>
<script>
const form = document.querySelector('form');
const output = document.querySelector('output');
function show(event) {
  event?.preventDefault();
  const values = Object.fromEntries(new FormData(form));
  const n = key => Number(values[key]);
  const money = value => value.toFixed(2) + ' units';
  const movement=n('closing')-n('opening');
  const variance=n('reported')-movement;
  const classification=movement>0 ? 'Increase' : movement<0 ? 'Decrease' : 'Maintained';
  output.textContent=[classification+': '+money(movement),'Reported variance: '+money(variance),variance===0?'Reconciled':'Exception review required'].join(String.fromCharCode(10));
}
form.addEventListener('submit', show);
show();
</script></html>
