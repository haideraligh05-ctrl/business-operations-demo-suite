<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payout Reconciliation</title><style>
body{margin:0;background:#eef2f6;color:#142d40;font:16px system-ui}main{max-width:680px;margin:6vh auto;padding:24px}form{background:white;border-radius:12px;padding:24px;display:grid;gap:14px}label{display:grid;gap:6px}input,select,button{font:inherit;padding:10px}output{display:block;margin-top:20px;background:#173950;color:white;padding:18px;border-radius:9px;white-space:pre-line}button{background:#165e6b;color:white;border:0;border-radius:7px}
</style><main><h1>Payout Reconciliation</h1><p>Reconcile a synthetic payout batch and decide whether it can move to review.</p><form><label>Gross payable<input name="gross" type="number" min="0" max="1000000" value="1000" required></label><label>Deductions<input name="deductions" type="number" min="0" max="1000000" value="100" required></label><label>Recoveries<input name="recoveries" type="number" min="0" max="1000000" value="50" required></label><label>Reported net<input name="reported" type="number" min="0" max="1000000" value="850" required></label><button>Run scenario</button></form><output aria-live="polite"></output></main>
<script>
const form = document.querySelector('form');
const output = document.querySelector('output');
function show(event) {
  event?.preventDefault();
  const values = Object.fromEntries(new FormData(form));
  const n = key => Number(values[key]);
  const money = value => value.toFixed(2) + ' units';
  const net = n('gross') - n('deductions') - n('recoveries');
  const variance = n('reported') - net;
  const status = net >= 0 && variance === 0 ? 'Ready for approval' : 'Exception review required';
  output.textContent = ['Calculated net: ' + money(net), 'Reported variance: ' + money(variance), status].join('\n');
}
form.addEventListener('submit', show);
show();
</script></html>
