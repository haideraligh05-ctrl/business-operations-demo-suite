<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment Operations Workbench</title><style>
body{margin:0;background:#eef2f6;color:#142d40;font:16px system-ui}main{max-width:680px;margin:6vh auto;padding:24px}form{background:white;border-radius:12px;padding:24px;display:grid;gap:14px}label{display:grid;gap:6px}input,select,button{font:inherit;padding:10px}output{display:block;margin-top:20px;background:#173950;color:white;padding:18px;border-radius:9px;white-space:pre-line}button{background:#165e6b;color:white;border:0;border-radius:7px}
</style><main><h1>Investment Operations Workbench</h1><p>Simulate an onboarding and funding review using fictional units.</p><form><label>Onboarding review<select name="kyc"><option>Approved</option><option>Pending</option><option>Rejected</option></select></label><label>Funding review<select name="funding"><option>Approved</option><option>Pending</option><option>Rejected</option></select></label><label>Funding requested<input name="amount" type="number" min="0" max="1000000" value="200" required></label><button>Run scenario</button></form><output aria-live="polite"></output></main>
<script>
const form = document.querySelector('form');
const output = document.querySelector('output');
function show(event) {
  event?.preventDefault();
  const values = Object.fromEntries(new FormData(form));
  const n = key => Number(values[key]);
  const money = value => value.toFixed(2) + ' units';
  const eligible = values.kyc === 'Approved' && values.funding === 'Approved' && n('amount') > 0;
  output.textContent = eligible ? 'Ready for operator confirmation: ' + money(n('amount')) :
    'Hold: positive funding and both review approvals are required.';
}
form.addEventListener('submit', show);
show();
</script></html>
